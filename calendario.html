<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS · Calendário</title>

    <script>
        (function () {
            var pref = localStorage.getItem('lifeOS_theme') || 'system';
            var theme = pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : pref;
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236366f1'/%3E%3Ctext x='12' y='17' font-size='13' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-shell">
        <div id="navOverlay" class="nav-overlay"></div>

        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand"><span class="brand-mark">L</span><span class="brand-name">Life OS</span></div>
                <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fechar menu"><i data-lucide="x"></i></button>
            </div>
            <div class="sidebar-nav">
                <a href="index.html" class="nav-link"><i data-lucide="home"></i><span>Visão Geral</span></a>
                <a href="treino.html" class="nav-link"><i data-lucide="dumbbell"></i><span>Saúde & Treino</span></a>
                <a href="calendario.html" class="nav-link active"><i data-lucide="calendar"></i><span>Calendário</span></a>
                <a href="diario.html" class="nav-link"><i data-lucide="book-open"></i><span>Meu Diário</span></a>
            </div>
            <div class="sidebar-footer">
                <a href="configuracoes.html" class="nav-link"><i data-lucide="settings"></i><span>Configurações</span></a>
            </div>
        </nav>

        <div class="app-main">
            <header class="topbar">
                <button class="icon-btn nav-toggle" id="navToggle" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
                <div class="topbar-title">
                    <h1>Calendário</h1>
                    <p>Veja diário, treinos e peso registrados em cada dia</p>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" id="themeToggleBtn" aria-label="Alternar tema"><i data-lucide="moon"></i></button>
                </div>
            </header>

            <main class="page-content">
                <div class="card">
                    <div class="calendar-nav">
                        <button type="button" class="icon-btn" id="mesAnterior" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button>
                        <h2 id="mesAtualLabel">Mês</h2>
                        <button type="button" class="icon-btn" id="mesSeguinte" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button>
                        <button type="button" class="btn btn-secondary btn-sm" id="btnHoje" style="margin-left: auto;">Hoje</button>
                    </div>

                    <div class="calendar-grid" id="calendarWeekdays"></div>
                    <div class="calendar-grid" id="calendarGrid" style="margin-top: 8px;"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de detalhes do dia -->
    <div id="dayModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-close-row">
                <button type="button" class="icon-btn" id="closeDayModal" aria-label="Fechar"><i data-lucide="x"></i></button>
            </div>
            <h2 id="dayModalTitle">Data</h2>
            <div id="dayModalBody"></div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="calendario.js"></script>
</body>

</html>
