<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS - Meu Diário</title>
    <style>
        /* Mesmas variáveis de cor do painel principal */
        :root {
            --bg-color: #f4f7f6;
            --sidebar-color: #2c3e50;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent-color: #3498db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-color);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid #455a64;
            padding-bottom: 10px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: var(--accent-color);
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 30px;
        }

        /* Estilo específico para os cards do Diário */
        .history-grid {
            display: flex;
            flex-direction: column; /* Coloca um abaixo do outro */
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent-color);
        }

        .card h3 {
            color: var(--sidebar-color);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .card p {
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap; /* Mantém as quebras de linha que você digitou */
        }
        
        .empty-state {
            text-align: center;
            color: #7f8c8d;
            padding: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <nav class="sidebar">
        <h2>Life OS</h2>
        <a href="index.html">🏠 Visão Geral</a>
        <a href="#">🏋️ Saúde & Treino</a>
        <a href="#">📅 Calendário</a>
        <a href="diario.html" style="background-color: var(--accent-color);">📖 Meu Diário</a>
    </nav>

    <!-- Painel Principal -->
    <main class="main-content">
        <div class="header">
            <h1>Histórico do Diário</h1>
            <p>Todas as suas reflexões e anotações diárias salvas.</p>
        </div>

        <!-- A mágica vai acontecer dentro desta div -->
        <div id="historicoContainer" class="history-grid">
            <!-- Os cards serão criados aqui automaticamente pelo JavaScript -->
        </div>
    </main>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const historicoContainer = document.getElementById('historicoContainer');

        function carregarHistorico() {
            // 1. Busca todos os diários na memória
            const diariosSalvos = JSON.parse(localStorage.getItem('lifeOS_diarios')) || {};
            
            // 2. Extrai todas as datas (as 'chaves' do objeto)
            const datas = Object.keys(diariosSalvos);

            // 3. Verifica se está vazio
            if (datas.length === 0) {
                historicoContainer.innerHTML = `
                    <div class="empty-state">
                        Nenhum registro encontrado. Volte na Visão Geral e escreva seu primeiro diário!
                    </div>
                `;
                return;
            }

            // 4. Inverte a ordem para mostrar do mais recente para o mais antigo
            datas.reverse();

            // 5. Limpa a tela antes de escrever
            historicoContainer.innerHTML = '';

            // 6. Laço de repetição (for...of) para desenhar os cards na tela
            for (let data of datas) {
                const textoDoDia = diariosSalvos[data];
                
                // Criação do card injetando HTML pelo JavaScript
                const cardHTML = `
                    <div class="card">
                        <h3>📅 Data: ${data}</h3>
                        <p>${textoDoDia}</p>
                    </div>
                `;
                
                // Adiciona o novo card ao final do container
                historicoContainer.innerHTML += cardHTML;
            }
        }

        // Roda a função ao abrir a página
        carregarHistorico();
    </script>
</body>
</html>
